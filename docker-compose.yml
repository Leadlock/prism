services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: /app/uploads
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@auditready.local}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-ab@neozaar.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_CHAT_MODEL: ${BEDROCK_CHAT_MODEL}
      BEDROCK_EMBEDDING_MODEL: ${BEDROCK_EMBEDDING_MODEL}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      PRISM_BASE_URL: /test
    volumes:
      - api_uploads:/app/uploads
      - prism_data:/app/prism_dpdp/data
      - prism_exports:/app/exports
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:4000"
      - "8080:8080"

  web:
    build: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:5173"

volumes:
  db_data:
  api_uploads:
  prism_data:
  prism_exports:
